<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Console admin – Village de Noël</title><style>body{margin:0;background:#14204a;color:#f4efe2;font:16px/1.5 system-ui,sans-serif;padding:24px 16px}main{max-width:880px;margin:0 auto}h1{font-size:26px;margin:0 0 4px}.sub{opacity:.7;margin:0 0 20px}.row{background:#1e2d63;border-radius:14px;padding:14px 16px;margin:0 0 12px}.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.t{font-weight:700;font-size:18px}.m{opacity:.8;font-size:14px;margin-top:4px}.pill{display:inline-block;background:#2f4390;border-radius:999px;padding:2px 10px;font-size:13px;margin:2px 6px 2px 0}.ok{background:#2f6b4f}button{font:inherit;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;background:#c9372c;color:#fff}button.g{background:#2f4390}.err{color:#ffb4a8}.tot{display:flex;gap:12px;flex-wrap:wrap;margin:0 0 18px}.tot div{background:#1e2d63;border-radius:14px;padding:10px 16px}.tot b{font-size:24px;display:block}</style></head><body><main><h1>Console admin</h1><p class="sub">Parties en cours. Aucun lien, aucun tirage, aucun message n’est visible ici.</p><div id="tot" class="tot"></div><p><button class="g" id="rf">Actualiser</button></p><div id="err" class="err"></div><div id="list"></div></main>
<script>
(function(){
  const A=new URLSearchParams(location.hash.slice(1)).get('a')||'';
  const BAKED={"u":"https://xmishnbxlprtupvfqvru.supabase.co","k":"sb_publishable_p9Zce6EHgPYSvPBc44B3Fw_u8YJkApD"};
  const $=s=>document.querySelector(s);
  const rpc=async(fn,a)=>{const r=await fetch(BAKED.u.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:BAKED.k,'Content-Type':'application/json'},body:JSON.stringify(a)});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.hint))||('HTTP '+r.status));return j;};
  const fd=s=>new Date(s).toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
  const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
  async function load(){
    $('#err').textContent='';
    try{
      const G=await rpc('admin_games',{p_secret:A}),L=$('#list');L.replaceChildren();
      const tp=G.reduce((s,g)=>s+g.players,0);
      $('#tot').replaceChildren(...[[G.length,'parties'],[tp,'joueurs'],[G.filter(g=>g.drawn).length,'tirages lancés']].map(([n,l])=>{const d=mk('div');d.append(mk('b','',n),l);return d;}));
      if(!G.length)L.append(mk('p','sub','Aucune partie pour le moment.'));
      G.forEach(g=>{
        const r=mk('div','row'),top=mk('div','top'),t=mk('div','t','Partie n°'+g.id+(g.occasion?' · '+g.occasion:'')),b=mk('button','','Supprimer');
        b.onclick=async()=>{if(prompt('Supprimer définitivement la partie n°'+g.id+' ('+g.players+' joueurs) ? Tape SUPPRIMER pour confirmer.')!=='SUPPRIMER')return;try{await rpc('admin_delete_game',{p_secret:A,p_id:g.id});load();}catch(e){$('#err').textContent=e.message;}};
        top.append(t,b);
        const m=mk('div','m');m.append(mk('span','pill','créée le '+fd(g.created)),mk('span','pill','ouverture le '+fd(g.opening)),mk('span','pill'+(g.drawn?' ok':''),g.drawn?'tirage lancé':'tirage non lancé'),mk('span','pill',g.answered+'/'+g.players+' réponses'),mk('span','pill',g.ready+' cadeaux prêts'));
        r.append(top,m,mk('div','m',g.names.join(', ')));L.append(r);
      });
    }catch(e){$('#err').textContent='Impossible de charger : '+e.message;}
  }
  $('#rf').onclick=load;load();
})();
</script></body></html>
